<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Some Settings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#7048e8"/>
    </linearGradient>
    <linearGradient id="slider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#bg)"/>

  <!-- 背景装饰：同心圆与刻度，暗示“设置” -->
  <g stroke="#ffffff" stroke-opacity="0.14" fill="none">
    <circle cx="80" cy="80" r="52" stroke-width="2"/>
    <circle cx="80" cy="80" r="40" stroke-width="2"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round">
    <path d="M80 16v10"/>
    <path d="M80 134v10"/>
    <path d="M16 80h10"/>
    <path d="M134 80h10"/>
  </g>

  <!-- 三条可独立启停的设置行 -->
  <g>
    <rect x="34" y="46" width="92" height="8" rx="4" fill="url(#slider)" opacity="0.5"/>
    <rect x="34" y="46" width="42" height="8" rx="4" fill="#ffffff"/>
    <circle cx="76" cy="50" r="9" fill="#ffffff" stroke="#3b5bdb" stroke-width="3"/>

    <rect x="34" y="76" width="92" height="8" rx="4" fill="url(#slider)" opacity="0.5"/>
    <rect x="34" y="76" width="76" height="8" rx="4" fill="#ffffff"/>
    <circle cx="110" cy="80" r="9" fill="#ffffff" stroke="#3b5bdb" stroke-width="3"/>

    <rect x="34" y="106" width="92" height="8" rx="4" fill="url(#slider)" opacity="0.5"/>
    <rect x="34" y="106" width="24" height="8" rx="4" fill="#ffffff"/>
    <circle cx="58" cy="110" r="9" fill="#ffffff" stroke="#3b5bdb" stroke-width="3"/>
  </g>
</svg>
