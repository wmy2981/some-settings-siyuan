<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Some Settings · preview</title>
<style>
/* 调色板与控件样式全部取自思源内置 daylight 主题与 b3-* 组件，
   保证这张预览图和插件实际打开的设置面板是同一种东西。 */
:root {
    --b3-theme-primary: #3575f0;
    --b3-theme-background: #fff;
    --b3-theme-surface: #f6f6f6;
    --b3-theme-surface-lighter: #e0e0e0;
    --b3-theme-on-background: #222;
    --b3-theme-on-surface: #5f6368;
    --b3-theme-on-surface-light: rgba(95, 99, 104, .68);
    --b3-border-color: var(--b3-theme-surface-lighter);
    --b3-border-radius: 6px;
    --b3-border-radius-b: 12px;
    --b3-list-hover: rgba(0, 0, 0, .075);
    --b3-select-background: #fff;
    --b3-switch-background: #e1e3e1;
    --b3-switch-border: var(--b3-theme-on-surface-light);
    --b3-switch-checked: #fff;
    --b3-switch-checked-background: var(--b3-theme-primary);
    --b3-dialog-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    --b3-font-family: "Segoe UI", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    --b3-font-family-code: "JetBrains Mono", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

body {
    width: 1024px;
    height: 768px;
    overflow: hidden;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--b3-font-family);
    font-size: 14px;
    line-height: 1.5;
    color: var(--b3-theme-on-background);
    background-color: var(--b3-theme-background);
}

/* ------------------------------------------------------------ 原生控件 */
.b3-switch {
    flex-shrink: 0;
    -webkit-appearance: none;
    width: 26px;
    height: 16px;
    border: 1px solid var(--b3-switch-border);
    border-radius: var(--b3-border-radius-b);
    margin: 0;
    outline: none;
    display: inline-block;
    position: relative;
    cursor: pointer;
    background-color: var(--b3-switch-background);
}
.b3-switch::after {
    width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 1;
    content: ""; background-color: var(--b3-switch-border); display: block;
    left: 7px; position: absolute; top: 50%; transform: translate(-50%, -50%);
}
.b3-switch:checked { background-color: var(--b3-switch-checked-background); border-color: transparent; }
.b3-switch:checked::after { background-color: var(--b3-switch-checked); height: 12px; width: 12px; left: 17px; }

.b3-text-field {
    border: 0;
    border-radius: var(--b3-border-radius);
    padding: 4px 8px;
    height: 28px;
    font-size: 14px;
    font-family: inherit;
    color: var(--b3-theme-on-background);
    background-color: var(--b3-select-background);
    box-shadow: inset 0 0 0 1px var(--b3-border-color);
    outline: none;
}
.b3-select {
    border: 0;
    border-radius: var(--b3-border-radius);
    padding: 4px 26px 4px 8px;
    height: 28px;
    font-size: 14px;
    font-family: inherit;
    color: var(--b3-theme-on-background);
    background-color: var(--b3-select-background);
    box-shadow: inset 0 0 0 1px var(--b3-border-color);
    appearance: none;
    cursor: pointer;
    outline: none;
    background-image:
        linear-gradient(45deg, transparent 50%, var(--b3-theme-on-surface) 50%),
        linear-gradient(135deg, var(--b3-theme-on-surface) 50%, transparent 50%);
    background-position: calc(100% - 14px) 12px, calc(100% - 9px) 12px;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
}
.b3-button {
    border: 0;
    border-radius: var(--b3-border-radius);
    padding: 4px 8px;
    height: 28px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    color: var(--b3-theme-on-background);
    background-color: transparent;
}
.b3-button--cancel { box-shadow: inset 0 0 0 1px var(--b3-border-color); }
.b3-button--text { color: var(--b3-theme-primary); }

.fn__flex { display: flex; }
.fn__flex-1 { flex: 1; min-width: 0; }
.fn__flex-center { display: flex; align-items: center; justify-content: center; }
.fn__size200 { width: 200px; flex-shrink: 0; }
.fn__space { width: 8px; flex-shrink: 0; }

/* ------------------------------------------------------------ 面板样式（与 src/core/ui.ts 中一致） */
.b3-label { padding: 6px 0; }
.b3-label__text { font-size: 12px; color: var(--b3-theme-on-surface); line-height: 15px; margin-top: 2px; }
.config-item { border-bottom: 1px solid var(--b3-border-color); }
.config-item:last-child { border-bottom: 0; }
.config-item__main { display: flex; flex-direction: column; justify-content: center; }
.config-title { font-size: 12px; font-weight: 600; color: var(--b3-theme-on-surface); padding: 6px 0 2px; }
.config-items { padding: 0 4px; }
.ss-panel__section { padding: 8px 0 2px; }
.ss-panel__section:first-child { padding-top: 0; }
.ss-panel__section-name { font-size: 14px; font-weight: 600; color: var(--b3-theme-on-background); }
.config-group + .config-group { margin-top: 4px; }
.config-item__number { gap: 8px; }

/* ------------------------------------------------------------ 弹窗外壳
   结构与宿主的 Dialog 完全一致：`.b3-dialog__body` 是纵向 flex，
   界面自带的 content 负责滚动，动作区固定在底部。 */
.b3-dialog {
    width: 768px;
    height: 630px;
    display: flex;
    flex-direction: column;
    background-color: var(--b3-theme-surface);
    border-radius: var(--b3-border-radius-b);
    box-shadow: var(--b3-dialog-shadow);
    overflow: hidden;
}
.b3-dialog__header {
    display: flex;
    align-items: center;
    height: 38px;
    padding: 0 24px;
    flex: 0 0 auto;
    font-weight: 600;
    border-bottom: 1px solid var(--b3-border-color);
}
.b3-dialog__body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: auto;
}
.b3-dialog__content {
    padding: 12px 24px 0;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
}
.b3-dialog__action {
    padding: 7px 24px;
    border-top: 1px solid var(--b3-border-color);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-shrink: 0;
    flex-wrap: wrap;
    user-select: none;
}

/* ------------------------------------------------------------ 画布排版 */
.sheet {
    width: 1024px;
    height: 768px;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    gap: 30px;
}
.legend {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 12px;
    color: var(--b3-theme-on-surface);
}
.legend__item { display: flex; align-items: center; gap: 6px; }
.legend__value {
    font-family: var(--b3-font-family-code);
    font-size: 11px;
    color: var(--b3-theme-primary);
}
.legend__value--off { color: var(--b3-theme-on-surface); }
.legend__spacer { flex: 1; }
.legend__path { font-family: var(--b3-font-family-code); font-size: 11px; color: var(--b3-theme-on-surface-light); }
</style>
</head>
<body>
<div class="sheet">
    <div class="b3-dialog">
        <div class="b3-dialog__header">Some Settings</div>
        <div class="b3-dialog__body">
            <div class="b3-dialog__content">
                <div class="some-settings-panel">
                    <div class="ss-panel__scroll">
                        <!-- 功能 -->
                        <div class="ss-panel__section"><div class="ss-panel__section-name">功能</div></div>
            <div class="config-group">
                <div class="config-title">示例：插件命令</div>
                <div class="config-items">
                    <div class="b3-label config-item">
                        <div class="fn__flex-1 config-item__main"><div class="b3-label__text">注册一个插件命令并响应本面板的设置，验证配置文件、保存流程与清理逻辑。</div></div>
                    </div>
                    <label class="fn__flex b3-label config-item">
                        <div class="fn__flex-1 config-item__main">
                            <div>启用示例命令</div>
                        </div>
                        <span class="fn__space"></span>
                        <input class="b3-switch fn__flex-center" type="checkbox" checked/>
                    </label>
                    <div class="fn__flex b3-label config-item">
                        <div class="fn__flex-1 config-item__main"><div>命令显示的消息</div></div>
                        <span class="fn__space"></span>
                        <input class="b3-text-field fn__flex-center fn__size200" value="一些设置"/>
                    </div>
                    <div class="fn__flex b3-label config-item">
                        <div class="fn__flex-1 config-item__main">
                            <div>显示消息前的延迟（毫秒）</div>
                        </div>
                        <span class="fn__space"></span>
                        <div class="fn__size200 fn__flex-center fn__flex config-item__number">
                            <input class="b3-text-field fn__flex-1" value="300"/>
                            <span class="ft__on-surface fn__flex-center">ms</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 界面 -->
            <div class="ss-panel__section"><div class="ss-panel__section-name">界面</div></div>
            <div class="config-group">
                <div class="config-title">示例：注入样式</div>
                <div class="config-items">
                    <div class="b3-label config-item">
                        <div class="fn__flex-1 config-item__main"><div class="b3-label__text">注入一段带命名空间的样式表，不改动核心 DOM，验证可回退的界面类功能。</div></div>
                    </div>
                    <label class="fn__flex b3-label config-item">
                        <div class="fn__flex-1 config-item__main">
                            <div>启用注入样式</div>
                        </div>
                        <span class="fn__space"></span>
                        <input class="b3-switch fn__flex-center" type="checkbox" checked/>
                    </label>
                    <div class="fn__flex b3-label config-item">
                        <div class="fn__flex-1 config-item__main"><div>强调色</div></div>
                        <span class="fn__space"></span>
                        <select class="b3-select fn__flex-center fn__size200">
                            <option>蓝色</option>
                            <option selected>橙色</option>
                            <option>绿色</option>
                            <option>红色</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 开发 -->
            <div class="ss-panel__section"><div class="ss-panel__section-name">开发</div></div>
            <div class="config-group">
                <div class="config-title">示例：开发日志</div>
                <div class="config-items">
                    <div class="b3-label config-item">
                        <div class="fn__flex-1 config-item__main"><div class="b3-label__text">开发期诊断：日志开关，以及每次配置变更时打印一次注册表快照。</div></div>
                    </div>
                    <label class="fn__flex b3-label config-item">
                        <div class="fn__flex-1 config-item__main">
                            <div>调试日志</div>
                            <div class="b3-label__text">插件运行期间在控制台输出更多诊断信息。</div>
                        </div>
                        <span class="fn__space"></span>
                        <input class="b3-switch fn__flex-center" type="checkbox"/>
                    </label>
                    <div class="fn__flex b3-label config-item">
                        <div class="fn__flex-1 config-item__main">
                            <div>控制台日志上限</div>
                            <div class="b3-label__text">一次最多打印多少条。</div>
                        </div>
                        <span class="fn__space"></span>
                        <input class="b3-text-field fn__flex-center fn__size200" value="50"/>
                    </div>
                </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="b3-dialog__action">
                <button class="b3-button b3-button--cancel">取消</button>
                <div class="fn__space"></div>
                <button class="b3-button b3-button--text">保存</button>
            </div>
        </div>
    </div>

    <div class="legend">
        <span class="legend__item"><span class="legend__value">0</span> 不加载不显示</span>
        <span class="legend__item"><span class="legend__value">1</span> 加载并显示</span>
        <span class="legend__item"><span class="legend__value">2</span> 加载但不显示</span>
        <span class="legend__item"><span class="legend__value">3</span> 不加载但显示</span>
        <span class="legend__spacer"></span>
        <span class="legend__path">feature-control.json</span>
    </div>
</div>
</body>
</html>
