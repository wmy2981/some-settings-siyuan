name: SiYuan Compatibility Check

# 每小时检查一次 siyuan-note/siyuan 的新发行版，命中本仓库功能关键词时开 issue 提醒开发者
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the issues that would be created
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# 顺序执行：正在跑的实例继续跑，新的实例排队等待
concurrency:
  group: siyuan-compat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check SiYuan releases
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/check-siyuan-releases.mjs
