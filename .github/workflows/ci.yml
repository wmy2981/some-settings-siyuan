name: CI

# main 与 dev 的推送和 PR 都跑一遍：
# 单元测试跑在 src/core/ 上，构建产物则验证「合并之后集市拿到的东西还能不能装」。
on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

# 同一个分支连续推送时只保留最新一次：前一次的结论已经没有意义了
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # package.json 的 engines 要求 node >= 24，测试链路（vitest / jsdom）也是；
      # 这里不能用 cd.yml 的 20——那是只跑构建的老版本。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # 声明与注册表、两份语言文件的一致性
      - name: Check feature declarations
        run: npm run check

      - name: Typecheck source
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # 构建放在最后：前面都过了才值得花时间打包，也顺带守住集市产物
      - name: Build
        run: npm run build
